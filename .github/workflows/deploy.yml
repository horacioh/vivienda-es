name: CI

# Valida, testea y construye en cada push y PR. El despliegue lo hace la
# integración Git de Cloudflare Pages (ver README → Despliegue).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (esquema + deduplicación)
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
